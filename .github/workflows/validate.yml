name: Validate evidence and synthetic analysis
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_project.py
      - run: python -m unittest discover -s tests -v
      - name: Publish submission readiness finding
        run: |
          if python scripts/validate_project.py --submission --json > readiness.json; then
            echo 'Submission semantic gate passed; human verification remains necessary.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Technical draft validated; submission review is incomplete.' >> "$GITHUB_STEP_SUMMARY"
          fi
          cat readiness.json >> "$GITHUB_STEP_SUMMARY"
